<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Node Runner Lua WASM</title>
  <style>
    :root {
      --bg-0: #08131a;
      --bg-1: #0d1f29;
      --bg-2: #153746;
      --panel: #0f222e;
      --panel-2: #132c3a;
      --ink: #d7ecf8;
      --muted: #89a6b7;
      --line: #284a5f;
      --accent: #2cc9aa;
      --accent-2: #26a7ff;
      --warn: #ffbf47;
      --error: #ff6b6b;
      --ok: #5fe09a;
      --mono: "JetBrains Mono", "IBM Plex Mono", "Fira Code", monospace;
      --sans: "Sora", "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(1200px 500px at 5% -10%, rgba(44, 201, 170, 0.18), transparent 60%),
        radial-gradient(900px 450px at 95% 0%, rgba(38, 167, 255, 0.14), transparent 60%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1) 50%, var(--bg-2));
      background-attachment: fixed;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.2;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.04) 0px,
        rgba(255, 255, 255, 0.04) 1px,
        transparent 1px,
        transparent 4px
      );
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1220px;
      margin: 0 auto;
      padding: 18px;
      min-height: 100dvh;
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(0, 1fr) 340px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 40%),
        var(--panel);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .workspace {
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: calc(100dvh - 36px);
      overflow: hidden;
    }

    .head {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      animation: fade-in 380ms ease;
    }

    .title {
      margin: 0;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: var(--mono);
      font-weight: 700;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .chip {
      font-family: var(--mono);
      font-size: 11px;
      color: #b8d4e4;
      border: 1px solid #2e5268;
      background: rgba(38, 167, 255, 0.12);
      border-radius: 999px;
      padding: 4px 9px;
      white-space: nowrap;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(17, 42, 56, 0.98), rgba(15, 34, 46, 0.96));
      backdrop-filter: blur(6px);
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      animation: slide-in 360ms ease;
    }

    button {
      border: 1px solid transparent;
      border-radius: 10px;
      min-height: 34px;
      padding: 7px 12px;
      font: 600 13px/1 var(--sans);
      color: #d9f1ff;
      cursor: pointer;
      transition: transform 140ms ease, filter 140ms ease, border-color 140ms ease;
      will-change: transform;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: none;
      border-color: #7dd6ff;
      box-shadow: 0 0 0 2px rgba(125, 214, 255, 0.25);
    }

    .btn-run {
      background: linear-gradient(180deg, #25c8a8, #168c75);
    }

    .btn-reset {
      background: linear-gradient(180deg, #2a8ad4, #1a5d93);
    }

    .btn-clear {
      background: linear-gradient(180deg, #be8a2e, #7f591b);
    }

    .btn-snippet {
      background: linear-gradient(180deg, #294556, #1c303d);
      border-color: #355c72;
      color: #c9dfec;
      font-weight: 500;
    }

    .editor-wrap {
      padding: 12px 14px 14px;
      display: grid;
      grid-template-rows: 230px minmax(180px, 1fr);
      gap: 10px;
      min-height: 0;
      animation: fade-in 420ms ease;
    }

    .graph-wrap {
      min-height: 0;
      border: 1px solid #34566a;
      border-radius: 12px;
      background:
        radial-gradient(480px 120px at 20% -20%, rgba(38, 167, 255, 0.14), transparent 70%),
        radial-gradient(420px 160px at 80% 120%, rgba(44, 201, 170, 0.16), transparent 70%),
        #0b1922;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      height: 100%;
      resize: vertical;
      border: 1px solid #34576b;
      border-radius: 12px;
      padding: 12px;
      color: #dff5ff;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 60%),
        #0c1c26;
      font: 500 13px/1.55 var(--mono);
      caret-color: #74e9d2;
      tab-size: 2;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    textarea:focus-visible {
      outline: none;
      border-color: #57bfd0;
      box-shadow: 0 0 0 2px rgba(87, 191, 208, 0.22);
    }

    .side {
      padding: 12px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      height: calc(100dvh - 36px);
      min-height: calc(100dvh - 36px);
      overflow: hidden;
      animation: fade-in 520ms ease;
    }

    .stack {
      display: grid;
      gap: 10px;
      height: 100%;
      min-height: 0;
      grid-template-rows: auto minmax(90px, 0.7fr) auto minmax(120px, 0.9fr) auto minmax(90px, 0.7fr) auto minmax(120px, 0.9fr);
      overflow: hidden;
    }

    .stack > pre {
      min-height: 0;
    }

    .k {
      margin: 0;
      font: 700 11px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ec2d6;
    }

    pre {
      margin: 0;
      padding: 10px;
      border-radius: 11px;
      border: 1px solid #34566a;
      background: #0b1922;
      overflow: auto;
      white-space: pre-wrap;
      font: 500 12px/1.45 var(--mono);
      color: #d3ebf8;
    }

    #meta {
      border-color: #325d75;
    }

    #output {
      border-color: #2f6b61;
      color: #d5ffee;
    }

    #error {
      border-color: #78414a;
      color: #ffd8dd;
      background: #1a1014;
    }

    .legend {
      margin: 0;
      color: #88a9bb;
      font-size: 11px;
      line-height: 1.35;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .workspace,
      .side {
        height: auto;
        min-height: auto;
      }

      .stack {
        grid-template-rows: auto minmax(95px, auto) auto minmax(120px, auto) auto minmax(95px, auto) auto minmax(120px, auto);
      }

      textarea {
        min-height: 240px;
      }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <main class="app">
    <section class="card workspace">
      <header class="head">
        <div>
          <h1 class="title">Node Runner Lua WASM</h1>
          <p class="subtitle">Local-only runtime. No external dependencies.</p>
        </div>
        <span class="chip">WASM + Lua</span>
      </header>

      <div class="toolbar">
        <button id="run" class="btn-run">Run Script</button>
        <button id="reset" class="btn-reset">Reset State</button>
        <button id="clear" class="btn-clear">Clear Buffers</button>
        <button id="clear-events" class="btn-snippet">Clear Events</button>
        <button class="btn-snippet" data-snippet="hello">Snippet: Hello</button>
        <button class="btn-snippet" data-snippet="sum">Snippet: Sum</button>
        <button class="btn-snippet" data-snippet="err">Snippet: Error</button>
      </div>

      <div class="editor-wrap">
        <div class="graph-wrap">
          <canvas id="graph"></canvas>
        </div>
        <textarea id="source">print("hello from lua")

local total = 0
for i = 1, 5 do
  total = total + i
end

print("sum", total)
</textarea>
      </div>
    </section>

    <aside class="card side">
      <p class="legend">Run valid Lua snippets for stable behavior in this minimal target.</p>
      <div class="stack">
        <h2 class="k">Status</h2>
        <pre id="meta">booting...</pre>
        <h2 class="k">Output</h2>
        <pre id="output"></pre>
        <h2 class="k">Error</h2>
        <pre id="error"></pre>
        <h2 class="k">Events</h2>
        <pre id="events"></pre>
      </div>
    </aside>
  </main>

  <script type="module">
    import { WASI, File, OpenFile, ConsoleStdout } from "./wasi.js";

    const SNIPPETS = {
      hello: 'print("hello from node-code")',
      sum: 'local n = 0\nfor i = 1, 8 do\n  n = n + i\nend\nprint("sum", n)',
      err: "error('boom from node-code')",
    };

    const NG = {
      NODE_GOAL: 1,
      NODE_CODE: 2,
      MAX_NODES: 1024,
      MAX_INPUTS: 32,
      MAX_OUTPUTS: 32,
      MAX_ARGS: 32,
    };

    const ABI = {
      I32: 4,
      INPUT_PORT_SIZE: 12,
      OUTPUT_PORT_SIZE: 4,
      VALUE_SLOT_SIZE: 12,
      NODE_HEADER_SIZE: 32,
    };
    ABI.NODE_SIZE =
      ABI.NODE_HEADER_SIZE +
      NG.MAX_INPUTS * ABI.INPUT_PORT_SIZE +
      NG.MAX_OUTPUTS * ABI.OUTPUT_PORT_SIZE +
      NG.MAX_ARGS * ABI.VALUE_SLOT_SIZE;

    const INFO = {
      LAST_ERROR: 4,
      GENERATION: 8,
      NODE_COUNT: 12,
      ACTIVE_GOAL_COUNT: 20,
      IO_LEN: 24 + NG.MAX_NODES * ABI.I32,
    };
    INFO.NODES = INFO.IO_LEN + ABI.I32;

    const NODE = {
      ID: 0,
      KIND: 4,
      EXEC_STATE: 8,
      INPUT_COUNT: 20,
    };

    const ui = {
      source: document.getElementById("source"),
      run: document.getElementById("run"),
      reset: document.getElementById("reset"),
      clear: document.getElementById("clear"),
      clearEvents: document.getElementById("clear-events"),
      graph: document.getElementById("graph"),
      meta: document.getElementById("meta"),
      output: document.getElementById("output"),
      error: document.getElementById("error"),
      events: document.getElementById("events"),
      snippets: Array.from(document.querySelectorAll("[data-snippet]")),
    };

    let api = null;
    let memory = null;
    let dv = null;
    let sourceByNode = new Map([[1, ui.source.value]]);
    const eventLines = [];
    const nodePositions = new Map([
      [1, { x: 120, y: 78 }],
      [2, { x: 420, y: 92 }],
    ]);

    const RUN_EVENT = {
      1: "run_started",
      2: "node_started",
      3: "node_succeeded",
      4: "node_failed",
      5: "run_finished",
    };

    function pushEvent(line) {
      eventLines.push(line);
      if (eventLines.length > 48) eventLines.shift();
      ui.events.textContent = eventLines.join("\n");
    }

    function clearEvents() {
      eventLines.length = 0;
      ui.events.textContent = "";
    }

    const td = new TextDecoder();

    function infoPtr() {
      return api.ng_get_info_ptr();
    }

    function readI32(off) {
      return dv.getInt32(infoPtr() + off, true);
    }

    function readU32(off) {
      return dv.getUint32(infoPtr() + off, true);
    }

    function readOutputText() {
      const len = api.ng_get_io_len();
      const ptr = api.ng_get_io_ptr();
      return td.decode(new Uint8Array(memory.buffer, ptr, len));
    }

    function readNodes() {
      const ptr = infoPtr();
      const nodes = [];
      for (let i = 0; i < NG.MAX_NODES; i++) {
        const base = ptr + INFO.NODES + i * ABI.NODE_SIZE;
        const id = dv.getUint32(base + NODE.ID, true);
        if (id === 0) continue;
        const kind = dv.getUint32(base + NODE.KIND, true);
        const execState = dv.getUint32(base + NODE.EXEC_STATE, true);
        const inputCount = dv.getUint32(base + NODE.INPUT_COUNT, true);
        const inputs = [];
        for (let j = 0; j < inputCount; j++) {
          const inBase = base + ABI.NODE_HEADER_SIZE + j * ABI.INPUT_PORT_SIZE;
          const inputId = dv.getUint32(inBase, true);
          const srcNodeId = dv.getUint32(inBase + 4, true);
          const srcOutputId = dv.getUint32(inBase + 8, true);
          inputs.push({ inputId, srcNodeId, srcOutputId });
        }
        nodes.push({ id, kind, execState, inputs });
      }
      return nodes;
    }

    function ensureNodePosition(nodeId, index) {
      if (nodePositions.has(nodeId)) return nodePositions.get(nodeId);
      const col = index % 4;
      const row = Math.floor(index / 4);
      const pos = { x: 80 + col * 170, y: 54 + row * 110 };
      nodePositions.set(nodeId, pos);
      return pos;
    }

    function drawNode(ctx, node, x, y) {
      const w = 132;
      const h = 56;
      const kindName = node.kind === NG.NODE_CODE ? "code" : node.kind === NG.NODE_GOAL ? "goal" : `k${node.kind}`;
      const stateName = node.execState === 1 ? "success" : node.execState === 2 ? "error" : node.execState === 3 ? "stale" : "never";
      const border = node.execState === 1 ? "#2cc9aa" : node.execState === 2 ? "#ff6b6b" : "#4e6d80";

      ctx.fillStyle = "#0f2431";
      ctx.strokeStyle = border;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#d7ecf8";
      ctx.font = "600 12px 'JetBrains Mono', monospace";
      ctx.fillText(`${kindName} #${node.id}`, x + 10, y + 22);
      ctx.fillStyle = "#9ec2d6";
      ctx.font = "500 11px 'JetBrains Mono', monospace";
      ctx.fillText(`state: ${stateName}`, x + 10, y + 40);
    }

    function renderGraph() {
      if (!api || !memory) return;
      const canvas = ui.graph;
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const width = Math.max(1, Math.floor(rect.width));
      const height = Math.max(1, Math.floor(rect.height));
      if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      const nodes = readNodes();
      const byId = new Map();
      nodes.forEach((node, index) => {
        const pos = ensureNodePosition(node.id, index);
        byId.set(node.id, { node, pos });
      });

      ctx.strokeStyle = "#3a5f76";
      ctx.lineWidth = 2;
      nodes.forEach((node) => {
        const to = byId.get(node.id);
        if (!to) return;
        node.inputs.forEach((input) => {
          if (input.srcNodeId === 0) return;
          const from = byId.get(input.srcNodeId);
          if (!from) return;
          const x1 = from.pos.x + 132;
          const y1 = from.pos.y + 28;
          const x2 = to.pos.x;
          const y2 = to.pos.y + 28;
          const mx = (x1 + x2) * 0.5;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2);
          ctx.stroke();
        });
      });

      nodes.forEach((node) => {
        const entry = byId.get(node.id);
        drawNode(ctx, node, entry.pos.x, entry.pos.y);
      });
    }

    function syncViews() {
      const lastError = readI32(INFO.LAST_ERROR);
      const ioText = readOutputText();
      if (lastError === 0) {
        ui.output.textContent = ioText;
        ui.error.textContent = "";
      } else {
        ui.output.textContent = "";
        ui.error.textContent = `error code ${lastError}\n${ioText}`;
      }
      ui.meta.textContent = [
        `last_error: ${lastError}`,
        `generation: ${readU32(INFO.GENERATION)}`,
        `node_count: ${readU32(INFO.NODE_COUNT)}`,
        `active_goal_count: ${readU32(INFO.ACTIVE_GOAL_COUNT)}`,
        `io_len: ${api.ng_get_io_len()} bytes`,
      ].join("\n");
      renderGraph();
    }

    function setupGraph() {
      let err = api.ng_init();
      if (err !== 0) return err;
      err = api.ng_clear_graph();
      if (err !== 0) return err;

      err = api.ng_node_create(1, NG.NODE_CODE);
      if (err !== 0) return err;
      err = api.ng_output_add(1, 1);
      if (err !== 0) return err;

      err = api.ng_node_create(2, NG.NODE_GOAL);
      if (err !== 0) return err;
      err = api.ng_input_add(2, 1);
      if (err !== 0) return err;
      err = api.ng_input_connect(2, 1, 1, 1);
      if (err !== 0) return err;
      err = api.ng_goal_set(2, 1);
      if (err !== 0) return err;

      return 0;
    }

    function runSource() {
      sourceByNode.set(1, ui.source.value);
      api.ng_exec_clear_all();
      try {
        api.ng_run_goal(2);
        syncViews();
      } catch (err) {
        ui.output.textContent = "";
        ui.error.textContent = `wasm trap: ${err.message}`;
        pushEvent(`wasm_trap ${err.message}`);
      }
    }

    async function boot() {
      const fds = [
        new OpenFile(new File([])),
        ConsoleStdout.lineBuffered(() => {}),
        ConsoleStdout.lineBuffered(() => {}),
      ];
      const wasi = new WASI(["node-runner.wasm"], [], fds);

      const response = await fetch("./node-runner.wasm");
      const bytes = await response.arrayBuffer();
      const { instance } = await WebAssembly.instantiate(bytes, {
        wasi_snapshot_preview1: wasi.wasiImport,
        env: {
          ng_on_node_changed: (nodeId, changeMask) => {
            pushEvent(`node_changed node=${nodeId} mask=0x${changeMask.toString(16)}`);
          },
          ng_on_run_event: (nodeId, eventKind, errorCode) => {
            const name = RUN_EVENT[eventKind] || `event_${eventKind}`;
            pushEvent(`${name} node=${nodeId} err=${errorCode}`);
          },
          ng_host_resolve: (nodeId, resolveKind, reqPtr, reqLen, outPtr, outCap, outLenPtr) => {
            if (!memory) return 7;
            if (resolveKind !== 1) return 7;
            const src = sourceByNode.get(nodeId) || "";
            const bytes = new TextEncoder().encode(src);
            if (bytes.length > outCap) return 4;
            new Uint8Array(memory.buffer, outPtr, bytes.length).set(bytes);
            new DataView(memory.buffer).setInt32(outLenPtr, bytes.length, true);
            return 0;
          },
        },
      });
      wasi.start(instance);

      api = instance.exports;
      memory = api.memory;
      dv = new DataView(memory.buffer);
      pushEvent("boot_ok");
      const err = setupGraph();
      if (err !== 0) throw new Error(`setupGraph failed with error ${err}`);
      syncViews();
    }

    ui.run.addEventListener("click", () => runSource());

    ui.reset.addEventListener("click", () => {
      try {
        const err = setupGraph();
        if (err !== 0) {
          ui.error.textContent = `reset failed: ${err}`;
        }
        syncViews();
      } catch (error) {
        ui.error.textContent = `reset trap: ${error.message}`;
        pushEvent(`reset_trap ${error.message}`);
      }
    });

    ui.clear.addEventListener("click", () => {
      try {
        api.ng_exec_clear_all();
        syncViews();
      } catch (err) {
        ui.error.textContent = `clear trap: ${err.message}`;
        pushEvent(`clear_trap ${err.message}`);
      }
    });

    ui.clearEvents.addEventListener("click", () => {
      clearEvents();
    });

    ui.snippets.forEach((button) => {
      button.addEventListener("click", () => {
        const key = button.getAttribute("data-snippet");
        if (key && SNIPPETS[key]) {
          ui.source.value = SNIPPETS[key];
        }
      });
    });

    window.addEventListener("resize", () => {
      renderGraph();
    });

    boot().catch((err) => {
      ui.meta.textContent = "boot failed";
      ui.error.textContent = err.message;
      console.error(err);
    });
  </script>
</body>
</html>
